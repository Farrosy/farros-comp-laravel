[package]
name = "farros-comp"
version = "0.1.0"
description = "Farros Comp E-Commerce Web App"

[build]
dockerfile = "Dockerfile"

[[services]]
name = "web"
container = "farros-comp"
publish = true

[[services.ports]]
port = 8080
target = 8080
transport = "http"

[dependencies]
"shira/php" = "8.5.10"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "shira/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-d", "error_reporting=24575", "-t", "/app/public", "-S", "0.0.0.0:8080"]
